version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Wait a week before proposing a new release, so a bad one can be pulled
    # before it reaches you.
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directories:
      - /packages/image-generation
      - /packages/image-to-3d
    schedule:
      interval: monthly
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]
    # Wait a week before proposing a new release, so a bad one can be pulled
    # before it reaches you.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Wait a week before proposing a new release, so a bad one can be pulled
    # before it reaches you.
    cooldown:
      default-days: 7
