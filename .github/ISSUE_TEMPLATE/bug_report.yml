name: Bug report
description: Report reproducible incorrect behaviour in a Toolkit package.
title: "bug: "
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - claude-token-optimisation
        - agent-workflow
        - image-generation
        - image-to-3d
        - documentation
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and reproduction
      description: Remove credentials, private paths, generated assets, and customer data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node/Python version, package revision, relevant command
