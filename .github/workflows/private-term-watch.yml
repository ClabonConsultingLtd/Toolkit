name: Private term watch

# Redacts private terms from issue, pull request and comment text as soon as
# it is posted, labels the item privacy-review and fails so the owner is
# notified. Checks out only the default branch and never runs PR code.
on: # zizmor: ignore[dangerous-triggers] this job only checks out the default branch and never runs pull request code
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  redact:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: node .github/scripts/private-terms.mjs
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          GITHUB_TOKEN: ${{ github.token }}
