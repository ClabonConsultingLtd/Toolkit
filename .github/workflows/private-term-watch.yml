name: Private term watch

# Redacts private terms from issue, pull request and comment text as soon as
# it is posted, labels the item privacy-review and fails so the owner is
# notified. Checks out only the default branch and never runs PR code.
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited, reopened]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  redact:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node .github/scripts/private-terms.mjs
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          GITHUB_TOKEN: ${{ github.token }}
