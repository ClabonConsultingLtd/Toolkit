# Tests the security-gates reusable workflow and its scripts on amd64 and
# arm64 runners.
#
# clean-tree  calls the reusable workflow by local path, as a Caller workflow
#             would, over Toolkit's own tree. It must pass.
# fixtures    runs each Gate over the committed fixtures in
#             packages/security-gates/test/fixtures, and checks that planted
#             findings fail their Gate and that clean ones pass.
name: security-gates self-test

on:
  pull_request:
    paths:
      - .github/workflows/security-gates.yml
      - .github/workflows/security-gates-self-test.yml
      - .gitleaks.toml
      - packages/security-gates/**
  push:
    branches: [main]
    paths:
      - .github/workflows/security-gates.yml
      - .github/workflows/security-gates-self-test.yml
      - .gitleaks.toml
      - packages/security-gates/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-tree:
    name: Clean tree (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    uses: ./.github/workflows/security-gates.yml
    with:
      runner: ${{ toJSON(matrix.runner) }}

  fixtures:
    name: Fixtures (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: packages/security-gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install and verify every scanner
        env:
          BIN: ${{ runner.temp }}/security-gates-bin
        run: node scripts/install-scanners.mjs --dest "$BIN" gitleaks osv-scanner opengrep
      - name: A changed hash in the versions file fails the install
        env:
          BIN: ${{ runner.temp }}/tampered-bin
          VERSIONS: ${{ runner.temp }}/tampered-versions.json
        run: |
          node -e '
            const fs = require("node:fs");
            const versions = JSON.parse(fs.readFileSync("scanner-versions.json", "utf8"));
            for (const hashes of Object.values(versions.gitleaks)) {
              for (const arch of Object.keys(hashes)) {
                hashes[arch] = (hashes[arch][0] === "0" ? "1" : "0") + hashes[arch].slice(1);
              }
            }
            fs.writeFileSync(process.argv[1], JSON.stringify(versions));
          ' "$VERSIONS"
          status=0
          node scripts/install-scanners.mjs --versions "$VERSIONS" --dest "$BIN" gitleaks > install.log 2>&1 || status=$?
          cat install.log
          if [ "$status" -eq 0 ] || ! grep -q 'SHA-256 mismatch' install.log || [ -e "$BIN/gitleaks" ]; then
            echo "::error::The install should have failed on the changed hash"
            exit 1
          fi
          echo "The install failed on the changed hash, as expected"
      - name: Opengrep rule tests
        env:
          BIN: ${{ runner.temp }}/security-gates-bin
        run: '"$BIN/opengrep" test --config rules test/rules'
      - name: Clean fixture passes every Gate
        env:
          BIN: ${{ runner.temp }}/security-gates-bin
        run: |
          for gate in secrets dependencies static-analysis; do
            node test/fixture-gate.mjs clean "$gate" --expect pass --bin "$BIN"
          done
      - name: A planted secret fails the secrets Gate
        env:
          BIN: ${{ runner.temp }}/security-gates-bin
        run: node test/fixture-gate.mjs secrets-planted secrets --expect fail --bin "$BIN"
      - name: A suppressed secret passes the secrets Gate
        env:
          BIN: ${{ runner.temp }}/security-gates-bin
        run: node test/fixture-gate.mjs secrets-suppressed secrets --expect pass --bin "$BIN"
      - name: A fixable vulnerable dependency fails the dependencies Gate
        env:
          BIN: ${{ runner.temp }}/security-gates-bin
        run: node test/fixture-gate.mjs dependencies-fixable dependencies --expect fail --bin "$BIN"
      - name: An unfixable high vulnerability is reported but passes
        env:
          BIN: ${{ runner.temp }}/security-gates-bin
        run: node test/fixture-gate.mjs dependencies-unfixable dependencies --expect pass --bin "$BIN"
      - name: An Opengrep ERROR pattern fails the static analysis Gate
        env:
          BIN: ${{ runner.temp }}/security-gates-bin
        run: node test/fixture-gate.mjs static-planted static-analysis --expect fail --bin "$BIN"
      - name: Suppressions with no reason, no expiry or a past expiry fail
        run: node test/fixture-gate.mjs suppressions-invalid suppressions --expect fail
      - name: Suppressions expiring within 14 days only warn
        run: node test/fixture-gate.mjs suppressions-expiring suppressions --expect warn --today 2026-01-01
