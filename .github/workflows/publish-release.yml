name: Publish release tag

# A push to main, not the release PR's closed event, so the release
# environment's main-only deployment rule applies to this run's ref. The
# environment must never be widened to PR refs.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    # pull-requests: read looks up the PR that the pushed commit merged.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.merge.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: merge
        name: Check whether this push merges the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-merge.mjs

  # Only a release merge reaches this job, so every other push to main skips
  # it and never enters the release environment or sees the signing key.
  tag:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    # Only release runs join the group, so a later push to main can't cancel a
    # pending release.
    concurrency:
      group: toolkit-publish-release
      cancel-in-progress: false
    # Elevated beyond the workflow-level default: pushing the tag and
    # publishing the GitHub Release need contents: write, and attesting build
    # provenance needs id-token: write and attestations: write.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] persisted credentials are used below to push the release tag
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: version
        name: Validate the lockstep release version
        run: |
          version="$(node --input-type=module -e 'import { releaseVersion } from "./.github/scripts/release-version.mjs"; process.stdout.write(releaseVersion(process.cwd()))')"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { releaseVersion } from "./.github/scripts/release-version.mjs";
            const version = releaseVersion(process.cwd());
            for (const file of ["packages/claude-token-optimisation/package.json", "packages/toolkit-sync/package.json", "packages/image-generation/pyproject.toml", "packages/image-to-3d/pyproject.toml", "packages/image-generation/uv.lock", "packages/image-to-3d/uv.lock"]) if (!readFileSync(file, "utf8").includes(version)) throw new Error(`${file} does not contain ${version}`);
          '
          echo "value=$version" >> "$GITHUB_OUTPUT"
      # The key is only written when the tag is new, to a 0600 file that the
      # trap and the always-run step below both delete.
      - id: tag
        name: Sign the immutable tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TAG_SIGNING_KEY: ${{ secrets.RELEASE_TAG_SIGNING_KEY }}
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; leaving it as is." >&2
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            key_file="$RUNNER_TEMP/release-tag-signing-key"
            trap 'rm -f "$key_file"' EXIT
            (umask 077 && printf '%s\n' "$RELEASE_TAG_SIGNING_KEY" > "$key_file")
            chmod 600 "$key_file"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -c gpg.format=ssh -c user.signingkey="$key_file" tag -s "$tag" --message "Release $tag"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-tag-signing-key"
      - name: Verify the tag against the Trust anchor
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=packages/toolkit-sync/allowed_signers verify-tag "$TAG"
      - name: Push the tag
        if: steps.tag.outputs.created == 'true'
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: git push origin "refs/tags/$TAG"
      - name: Build the release archive and checksums
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          git archive --format=tar.gz --prefix="toolkit-${TAG}/" -o "toolkit-${TAG}.tar.gz" "$TAG"
          sha256sum "toolkit-${TAG}.tar.gz" > SHA256SUMS
          mkdir /tmp/archive
          tar -xzf "toolkit-${TAG}.tar.gz" -C /tmp/archive
      # Syft is pinned by version and its published checksum rather than a
      # marketplace action, so the binary that generates the SBOM is verified
      # the same way the release archive itself is.
      - name: Install Syft
        env:
          SYFT_VERSION: "1.52.0"
          SYFT_SHA256: "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d"
        run: |
          curl --fail -sSL -o /tmp/syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
      - name: Generate the SBOM
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: /tmp/syft scan "dir:/tmp/archive/toolkit-${TAG}" -o "cyclonedx-json=toolkit-${TAG}.cdx.json"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: toolkit-${{ steps.tag.outputs.value }}.tar.gz
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: node .github/scripts/release-assets.mjs
