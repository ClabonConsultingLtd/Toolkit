name: Publish release tag

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# Only the release PR's own merge may join the group: GitHub cancels the older
# pending run when another joins, and skipped runs would displace a real one.
concurrency:
  group: ${{ github.event.pull_request.merged && github.event.pull_request.head.ref == 'release/next' && 'toolkit-publish-release' || format('toolkit-publish-release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release/next'
    runs-on: ubuntu-latest
    # Elevated beyond the workflow-level default: pushing the tag and
    # publishing the GitHub Release need contents: write, and attesting build
    # provenance needs id-token: write and attestations: write.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] persisted credentials are used below to push the release tag
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - id: version
        name: Validate the lockstep release version
        run: |
          version="$(node --input-type=module -e 'import { releaseVersion } from "./.github/scripts/release-version.mjs"; process.stdout.write(releaseVersion(process.cwd()))')"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { releaseVersion } from "./.github/scripts/release-version.mjs";
            const version = releaseVersion(process.cwd());
            for (const file of ["packages/claude-token-optimisation/package.json", "packages/toolkit-sync/package.json", "packages/image-generation/pyproject.toml", "packages/image-to-3d/pyproject.toml", "packages/image-generation/uv.lock", "packages/image-to-3d/uv.lock"]) if (!readFileSync(file, "utf8").includes(version)) throw new Error(`${file} does not contain ${version}`);
          '
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - id: tag
        name: Create the immutable tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; leaving it as is." >&2
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$tag" --message "Release $tag"
            git push origin "$tag"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
      - name: Build the release archive and checksums
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          git archive --format=tar.gz --prefix="toolkit-${TAG}/" -o "toolkit-${TAG}.tar.gz" "$TAG"
          sha256sum "toolkit-${TAG}.tar.gz" > SHA256SUMS
          mkdir /tmp/archive
          tar -xzf "toolkit-${TAG}.tar.gz" -C /tmp/archive
      # Syft is pinned by version and its published checksum rather than a
      # marketplace action, so the binary that generates the SBOM is verified
      # the same way the release archive itself is.
      - name: Install Syft
        env:
          SYFT_VERSION: "1.52.0"
          SYFT_SHA256: "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d"
        run: |
          curl --fail -sSL -o /tmp/syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
      - name: Generate the SBOM
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: /tmp/syft scan "dir:/tmp/archive/toolkit-${TAG}" -o "cyclonedx-json=toolkit-${TAG}.cdx.json"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: toolkit-${{ steps.tag.outputs.value }}.tar.gz
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: node .github/scripts/release-assets.mjs
