name: Prepare release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

# GitHub keeps one pending run per group and cancels the older one, so only
# runs that do work may join it. Each run rebuilds the whole candidate, so the
# run that survives a burst of merges still includes every labelled PR.
concurrency:
  group: ${{ github.event.pull_request.merged && github.event.pull_request.base.ref == 'main' && 'toolkit-prepare-release' || format('toolkit-prepare-release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] persisted credentials are used below to push the release branch
        with:
          ref: main
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: version
        name: Rebuild the release candidate from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -B release/next
          version="$(node .github/scripts/release-version.mjs)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - id: pending
        if: steps.version.outputs.value != ''
        name: Find the open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh pr list --base main --head release/next --state open --json number --jq '.[0].number')"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Commit and push the release candidate
        if: steps.version.outputs.value != ''
        env:
          PR_NUMBER: ${{ steps.pending.outputs.number }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git add CHANGELOG.md packages/*/package.json packages/*/pyproject.toml packages/*/uv.lock
          git commit -m "Release v$VERSION"
          if [[ -n "$PR_NUMBER" ]] && git rev-parse -q --verify origin/release/next >/dev/null && git diff --quiet origin/release/next HEAD; then
            echo "release/next already matches this candidate"
          else
            git push --force-with-lease origin release/next
          fi
      - name: Create or update the release pull request
        if: steps.version.outputs.value != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pending.outputs.number }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          body="Automated release candidate. Merging this PR creates immutable tag v$VERSION. It is rebuilt from main after every merge and lists each labelled PR merged since the last release."
          if [[ -n "$PR_NUMBER" ]]; then gh pr edit "$PR_NUMBER" --title "Release v$VERSION" --body "$body"; else gh pr create --base main --head release/next --title "Release v$VERSION" --body "$body"; fi
