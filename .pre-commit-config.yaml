# Copied from the security-gates Starter configuration
# (packages/security-gates/starter/pre-commit-config.yaml). Owned by Toolkit
# from here on: nothing enforces it, and the Gates in CI still decide whether
# a change can merge. Run `pre-commit install` to use it locally.
#
# Revisions are frozen to commit SHAs. `pre-commit autoupdate --freeze` bumps
# them.
repos:
  # Scans staged changes for secrets. It reads the same .gitleaksignore as the
  # secrets Gate, but also honours inline gitleaks:allow comments, which the
  # Gate ignores.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # Ruff's flake8-bandit (S) security rules, for the Python packages. Runs
  # only the S rules, so keep your usual Ruff hook, if any, for everything
  # else.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd # frozen: v0.16.9
    hooks:
      - id: ruff-check
        name: ruff security rules (S)
        args: [--select, S]
