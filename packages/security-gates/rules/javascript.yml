# Hand-written Opengrep rules for JavaScript and TypeScript, including
# Node.js, Express and Next.js code. ERROR fails the static analysis Gate;
# WARNING and INFO are reported only.
rules:
  - id: js-eval-dynamic
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      eval() runs a value that isn't a string literal. If any part of it comes
      from outside the program, this is code injection. Parse data with
      JSON.parse or dispatch through a lookup table instead.
    metadata:
      cwe: "CWE-95: Eval Injection"
    patterns:
      - pattern: eval($CODE)
      - pattern-not: eval("...")

  - id: js-new-function-dynamic
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      new Function() builds code from a value that isn't a string literal,
      which is equivalent to eval(). Avoid building code from strings.
    metadata:
      cwe: "CWE-95: Eval Injection"
    patterns:
      - pattern-either:
          - pattern: new Function(..., $BODY)
          - pattern: Function(..., $BODY)
      - pattern-not: new Function(..., "...")
      - pattern-not: Function(..., "...")

  - id: js-child-process-command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A shell command is built by string concatenation or interpolation and
      run through child_process. Anything interpolated can inject shell
      syntax. Use execFile or spawn with an argument array and no shell.
    metadata:
      cwe: "CWE-78: OS Command Injection"
    patterns:
      - pattern-either:
          - pattern-inside: |
              $CP = require("child_process")
              ...
          - pattern-inside: |
              $CP = require("node:child_process")
              ...
          - pattern-inside: |
              import $CP from "child_process"
              ...
          - pattern-inside: |
              import $CP from "node:child_process"
              ...
          - pattern-inside: |
              import * as $CP from "child_process"
              ...
          - pattern-inside: |
              import * as $CP from "node:child_process"
              ...
      - pattern-either:
          - pattern: $CP.$EXEC(`...${$X}...`, ...)
          - pattern: $CP.$EXEC($A + $B, ...)
      - metavariable-regex:
          metavariable: $EXEC
          regex: ^(exec|execSync)$

  - id: js-child-process-command-injection-import
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A shell command is built by string concatenation or interpolation and
      run through child_process. Anything interpolated can inject shell
      syntax. Use execFile or spawn with an argument array and no shell.
    metadata:
      cwe: "CWE-78: OS Command Injection"
    patterns:
      - pattern-either:
          - pattern-inside: |
              import { ..., $EXEC, ... } from "child_process"
              ...
          - pattern-inside: |
              import { ..., $EXEC, ... } from "node:child_process"
              ...
          - pattern-inside: |
              const { ..., $EXEC, ... } = require("child_process")
              ...
          - pattern-inside: |
              const { ..., $EXEC, ... } = require("node:child_process")
              ...
      - pattern-either:
          - pattern: $EXEC(`...${$X}...`, ...)
          - pattern: $EXEC($A + $B, ...)
      - metavariable-regex:
          metavariable: $EXEC
          regex: ^(exec|execSync)$

  - id: js-spawn-shell-dynamic
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A process is started with shell: true and a command that isn't a string
      literal. Check that no untrusted value reaches the command or its
      arguments, or drop shell: true and pass an argument array.
    metadata:
      cwe: "CWE-78: OS Command Injection"
    patterns:
      - pattern-either:
          - pattern: "$F($CMD, $ARGS, {..., shell: true, ...})"
          - pattern: "$F($CMD, {..., shell: true, ...})"
          - pattern: "$O.$F($CMD, $ARGS, {..., shell: true, ...})"
          - pattern: "$O.$F($CMD, {..., shell: true, ...})"
      - metavariable-regex:
          metavariable: $F
          regex: ^(spawn|spawnSync|execFile|execFileSync)$
      - pattern-not: $F("...", ...)
      - pattern-not: $O.$F("...", ...)

  - id: js-tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      TLS certificate verification is turned off, so any machine in the path
      can read and change this traffic. Trust the right CA instead (the ca
      option or NODE_EXTRA_CA_CERTS).
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"

  - id: js-jwt-none-algorithm
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      JWT verification accepts the "none" algorithm, so an unsigned token
      passes. List only the algorithms you issue.
    metadata:
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
    pattern: '$JWT.verify(..., {..., algorithms: [..., "none", ...], ...}, ...)'

  - id: js-dom-html-sink
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      HTML is written to the DOM from a value that isn't a string literal.
      If it can contain user input, this is cross-site scripting. Use
      textContent, or sanitise the HTML first.
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: $EL.insertAdjacentHTML($POS, $X)
          - pattern: document.write($X)
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."
      - pattern-not: $EL.insertAdjacentHTML($POS, "...")
      - pattern-not: document.write("...")

  - id: react-dangerously-set-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      dangerouslySetInnerHTML renders a value that isn't a string literal.
      If it can contain user input, this is cross-site scripting. Sanitise
      it first or render it as text.
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
    patterns:
      - pattern: "<$EL dangerouslySetInnerHTML={{__html: $X}} />"
      - pattern-not: '<$EL dangerouslySetInnerHTML={{__html: "..."}} />'

  - id: express-open-redirect
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      The redirect target comes straight from the request, which allows an
      open redirect. Check it against a list of allowed paths or hosts.
    metadata:
      cwe: "CWE-601: Open Redirect"
    pattern-either:
      - pattern: $RES.redirect($REQ.query.$P)
      - pattern: $RES.redirect($REQ.body.$P)
      - pattern: $RES.redirect($REQ.params.$P)
      - pattern: $RES.redirect($STATUS, $REQ.query.$P)
      - pattern: $RES.redirect($STATUS, $REQ.body.$P)
      - pattern: $RES.redirect($STATUS, $REQ.params.$P)

  - id: express-reflected-input
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Request input is sent straight back in the response body, which can be
      cross-site scripting. Encode it for the context, or return JSON.
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
    pattern-either:
      - pattern: $RES.send($REQ.query.$P)
      - pattern: $RES.send($REQ.body.$P)
      - pattern: $RES.send($REQ.params.$P)
      - pattern: $RES.send(`...${$REQ.query.$P}...`)
      - pattern: $RES.send(`...${$REQ.params.$P}...`)
      - pattern: $RES.write($REQ.query.$P)

  - id: express-cors-any-origin-with-credentials
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      CORS allows credentials from any origin, so any site can make
      authenticated requests and read the responses. List the allowed
      origins.
    metadata:
      cwe: "CWE-942: Permissive Cross-domain Policy"
    pattern-either:
      - pattern: 'cors({..., origin: true, ..., credentials: true, ...})'
      - pattern: 'cors({..., credentials: true, ..., origin: true, ...})'
      - pattern: 'cors({..., origin: "*", ..., credentials: true, ...})'
      - pattern: 'cors({..., credentials: true, ..., origin: "*", ...})'

  - id: nextjs-public-env-secret
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A NEXT_PUBLIC_ variable is named like a secret. Next.js inlines every
      NEXT_PUBLIC_ value into the browser bundle, so anyone can read it.
      Keep secrets in server-only variables. Some services issue tokens meant
      for the browser; those are fine here.
    metadata:
      cwe: "CWE-200: Exposure of Sensitive Information"
    patterns:
      - pattern: process.env.$VAR
      - metavariable-regex:
          metavariable: $VAR
          regex: ^NEXT_PUBLIC_\w*(SECRET|PRIVATE_KEY|PASSWORD|PASSWD|TOKEN|CREDENTIALS?)$

  - id: nextjs-open-redirect
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      The redirect target comes straight from the query string, which allows
      an open redirect. Check it against a list of allowed paths.
    metadata:
      cwe: "CWE-601: Open Redirect"
    pattern-either:
      - pattern: redirect($PARAMS.get(...))
      - pattern: permanentRedirect($PARAMS.get(...))
      - pattern: NextResponse.redirect($PARAMS.get(...))
      - pattern: $ROUTER.push($PARAMS.get(...))
